<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="url(#bg)"/>
  <!-- Musical note (beamed eighth notes) drawn with paths -->
  <g transform="translate(280, 170)" fill="white">
    <!-- Note 1 stem -->
    <rect x="180" y="20" width="36" height="380" rx="6"/>
    <!-- Note 1 notehead -->
    <ellipse cx="150" cy="400" rx="85" ry="65" transform="rotate(-15, 150, 400)"/>
    <!-- Note 2 stem -->
    <rect x="370" y="60" width="36" height="340" rx="6"/>
    <!-- Note 2 notehead -->
    <ellipse cx="340" cy="400" rx="85" ry="65" transform="rotate(-15, 340, 400)"/>
    <!-- Beam connecting the two notes -->
    <rect x="180" y="20" width="226" height="48" rx="8"/>
    <!-- Second beam -->
    <rect x="180" y="92" width="226" height="48" rx="8"/>
  </g>
</svg>
